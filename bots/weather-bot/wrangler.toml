name = "myweather-bot"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# 定时触发（Cron Trigger，UTC 时区）
#   "35 13,23 * * *"  -> 单条表达式，每 12 小时触发两次：
#        UTC 23:35 = 北京时间次日 07:35 => 推送“今天”的天气
#        UTC 13:35 = 北京时间     21:35 => 推送“明天”的天气
# 注意：Cloudflare Cron 只精确到分钟，且使用 UTC；
#      合并成一条后 event.cron 不再区分早晚，播报模式改由命中的 UTC 小时决定
#      （见 src/lib/schedule.ts 的 MODE_BY_UTC_HOUR）。
# ---------------------------------------------------------------------------
[triggers]
crons = [
  "35 13,23 * * *",
]

# ---------------------------------------------------------------------------
# Workflow 绑定（Cloudflare Workflows）
# ---------------------------------------------------------------------------
[[workflows]]
binding = "WEATHER_WORKFLOW"
name = "weather-report-workflow"
class_name = "WeatherReportWorkflow"

# ---------------------------------------------------------------------------
# 普通变量（非敏感信息，可直接改；敏感信息请用 wrangler secret put）
# ---------------------------------------------------------------------------
[vars]
TIMEZONE = "Asia/Shanghai"
CITY_ID = "101010100"      # 和风天气 LocationID（城市）
CITY_NAME = "北京"
LAT = "39.9042"
LON = "116.4074"
# 可选：数据源开关，"1" 开启
ENABLE_QWEATHER = "1"
ENABLE_OPEN_METEO = "1"
ENABLE_WTTR = "0"

# ---------------------------------------------------------------------------
# 需要 `wrangler secret put XXX` 设置的机密变量：
#   FEISHU_WEBHOOK_URL   飞书群自定义机器人 Webhook 地址（必填）
#   FEISHU_SECRET       飞书机器人签名校验密钥（若开启了“签名校验”则必填）
#   QWEATHER_API_KEY    和风天气 API Key（与 JWT 二选一）
#   QWEATHER_PROJECT_ID 和风天气 项目ID  -> JWT payload.sub
#   QWEATHER_DEV_ID     和风天气 开发者ID（Q 开头 10 位）-> JWT payload.iss（可选）
#   QWEATHER_KID        和风天气 凭据ID  -> JWT header.kid
#   QWEATHER_PRIVATE_KEY和风天气 Ed25519 私钥（PEM 或纯 Base64 均可）
#   QWEATHER_HOST       和风天气 API Host，例如 abcxyz.qweatherapi.com
#
# 注意：JWT 的 header.alg 必须是 "EdDSA"（不是 "ED25519"）；
#      项目ID 放 sub，开发者ID 放 iss，两者不是同一个值。
#      iss 是否必填可用 `npm run verify:qweather` 实测（脚本会三种组合各试一次）。
# ---------------------------------------------------------------------------

[observability]
enabled = true
